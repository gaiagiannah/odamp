[workspace]
resolver = "2"
members = [
    "core/security",
    "core/portfolio",
    "core/compliance",
    "core/indexer",
    "api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ODAMP Project"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
