[workspace]
resolver = "2"
members = [
    "core/security/mpc_engine",
    "core/security/pqc",
    "core/security/zk",
    "core/security/key_recovery",
    "core/execution/order_router",
    "core/execution/dex_agg",
    "core/execution/cex_gateway",
    "core/execution/cross_chain",
    "core/execution/mev_protect",
    "core/execution/algo_strats",
    "core/agents/orchestrator",
    "core/agents/portfolio_mgr",
    "core/agents/risk_sentinel",
    "core/agents/yield_opt",
    "core/agents/compliance",
    "core/agents/geopol",
    "core/agents/scam_detect",
    "core/agents/tax_advisor",
    "core/agents/exec_opt",
    "core/data/indexer",
    "core/data/market_data",
    "core/data/geopol_db",
    "core/data/tax_db",
    "core/data/analytics",
    "core/portfolio/state",
    "core/portfolio/pnl",
    "core/portfolio/allocation",
    "core/portfolio/tax",
    "core/compliance/kyc_aml",
    "core/compliance/sanctions",
    "core/compliance/travel_rule",
    "core/compliance/reporting",
    "api/server",
    "api/mcp",
    "frontend/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ODAMP Project"]

[workspace.dependencies]
# Cryptography
ring = "0.17"
ed25519-dalek = "2.1"
p256 = "0.13"
k256 = "0.13"
x25519-dalek = "2.0"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = "1.7"

# Post-Quantum
ml-dsa = "0.1"
slh-dsa = "0.1"
ml-kem = "0.1"

# Web / API
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-trait = "0.1"

# Blockchain
alloy = "0.3"
solana-sdk = "2"
solana-client = "2"
ethers = "2"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Messaging
rdkafka = { version = "0.36", features = ["cmake-build"] }

# AI / ML
candle-core = "0.6"
candle-transformers = "0.6"
tokenizers = "0.15"

# Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"
opentelemetry = "0.21"

# Utilities
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
config = "0.14"
dotenvy = "0.15"
hex = "0.4"
base64 = "0.22"   