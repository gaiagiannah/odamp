services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: odamp
      POSTGRES_PASSWORD: odamp_dev_only
      POSTGRES_DB: odamp
    ports:
      - "5432:5432"
    volumes:
      - odamp_pgdata:/var/lib/postgresql/data
    # Schema is applied by the API at startup via sqlx::migrate!
    # (see api/src/db.rs::run_migrations), not by Postgres init
    # scripts — keeping one source of truth for migration state
    # instead of two competing mechanisms.

volumes:
  odamp_pgdata:
