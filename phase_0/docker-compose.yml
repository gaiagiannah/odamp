services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: odamp
      POSTGRES_PASSWORD: odamp_dev_only
      POSTGRES_DB: odamp
    ports:
      - "5432:5432"
    volumes:
      - odamp_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  odamp_pgdata:
